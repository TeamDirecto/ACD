<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control ACD - AIMTI</title>
  <style>
    :root {
      --navy: #122433;
      --navy-2: #1d3446;
      --green: #16a34a;
      --green-dark: #12833d;
      --green-soft: #eefaf2;
      --border: #dfe5ea;
      --muted: #66727d;
      --surface: #ffffff;
      --background: #f4f6f8;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: #1f2933;
    }

    [hidden] { display: none !important; }

    .topbar {
      background: var(--navy);
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .topbar-inner {
      max-width: 1180px;
      min-height: 70px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .divider {
      width: 1px;
      height: 26px;
      background: rgba(255,255,255,.20);
    }

    .portal-title {
      color: #e9eef2;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
    }

    .user-name {
      color: #d8e1e7;
    }

    button {
      font: inherit;
    }

    .logout-button {
      width: auto;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 7px;
      padding: 9px 13px;
      background: transparent;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .logout-button:hover {
      background: rgba(255,255,255,.08);
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 34px 24px 48px;
    }

    .section-heading {
      margin-bottom: 18px;
    }

    .section-heading h1 {
      margin: 0;
      font-size: 24px;
    }

    .section-heading p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .campaign-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .campaign-card {
      min-height: 166px;
      padding: 17px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(15, 23, 42, .05);
      text-align: left;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .campaign-card:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: #aab8c2;
      box-shadow: 0 6px 16px rgba(15, 23, 42, .08);
    }

    .campaign-card.selected {
      border: 2px solid var(--green);
      padding: 16px 13px;
      box-shadow: 0 5px 16px rgba(22, 163, 74, .12);
    }

    .campaign-card:disabled {
      cursor: not-allowed;
      opacity: .48;
    }

    .campaign-id {
      font-size: 16px;
      font-weight: 800;
    }

    .campaign-name {
      min-height: 32px;
      margin-top: 5px;
      color: #4b5563;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .campaign-level-label {
      margin-top: 18px;
      color: #7a8791;
      font-size: 11px;
    }

    .campaign-level {
      margin-top: 3px;
      color: var(--green);
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
    }

    .campaign-level.loading {
      color: #9aa5ad;
      font-size: 13px;
      font-weight: 600;
      line-height: 30px;
    }

    .detail-card {
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
      box-shadow: 0 3px 12px rgba(15, 23, 42, .06);
      overflow: hidden;
    }

    .detail-header {
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
    }

    .detail-kicker {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .detail-title {
      margin-top: 5px;
      font-size: 21px;
      font-weight: 800;
    }

    .detail-body {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 0;
    }

    .current-panel {
      min-height: 230px;
      padding: 28px 22px;
      border-right: 1px solid var(--border);
      background: #fbfcfd;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .current-label {
      color: var(--muted);
      font-size: 13px;
    }

    .current-value {
      margin-top: 12px;
      color: var(--green);
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
    }

    .current-status {
      min-height: 18px;
      margin-top: 12px;
      color: #82909b;
      font-size: 12px;
    }

    .change-panel {
      min-height: 230px;
      padding: 28px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .change-title {
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: 800;
    }

    .level-options {
      display: grid;
      grid-template-columns: repeat(8, minmax(42px, 1fr));
      gap: 8px;
      margin-bottom: 22px;
    }

    .level-button {
      height: 43px;
      border: 1px solid #d7dee4;
      border-radius: 7px;
      background: #fff;
      color: #334155;
      font-weight: 700;
      cursor: pointer;
    }

    .level-button:hover:not(:disabled) {
      border-color: var(--green);
    }

    .level-button.active {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
    }

    .level-button:disabled {
      cursor: not-allowed;
      opacity: .5;
    }

    .apply-button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 7px;
      background: var(--green);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .apply-button:hover:not(:disabled) {
      background: var(--green-dark);
    }

    .apply-button:disabled {
      cursor: not-allowed;
      opacity: .52;
    }

    #result {
      display: none;
      margin: 0 22px 22px;
      padding: 14px 16px;
      border-radius: 7px;
      font-size: 14px;
      line-height: 1.45;
    }

    .success {
      display: block !important;
      background: #eaf8ee;
      border: 1px solid #a9d7b6;
    }

    .error {
      display: block !important;
      background: #fdecec;
      border: 1px solid #e6b1b1;
    }

    .info {
      display: block !important;
      background: #edf5ff;
      border: 1px solid #b9d4f1;
    }

    .login-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        linear-gradient(rgba(18,36,51,.88), rgba(18,36,51,.88)),
        radial-gradient(circle at 20% 20%, #466171, #122433 65%);
      backdrop-filter: blur(4px);
    }

    .login-modal {
      width: 100%;
      max-width: 410px;
      padding: 34px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 13px;
      background: rgba(29,52,70,.96);
      box-shadow: 0 22px 60px rgba(0,0,0,.32);
      color: #fff;
    }

    .login-modal h2 {
      margin: 0;
      font-size: 27px;
      text-align: center;
    }

    .login-modal .subtitle {
      margin: 9px 0 27px;
      color: #c6d1d8;
      font-size: 14px;
      text-align: center;
    }

    .login-modal label {
      display: block;
      margin: 14px 0 7px;
      color: #e5ebef;
      font-size: 13px;
      font-weight: 700;
    }

    .login-modal input {
      width: 100%;
      padding: 13px;
      border: 1px solid #587080;
      border-radius: 7px;
      outline: none;
      background: rgba(255,255,255,.07);
      color: #fff;
      font-size: 15px;
    }

    .login-modal input::placeholder {
      color: #9fb0bb;
    }

    .login-modal input:focus {
      border-color: #43c66c;
    }

    .login-button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: var(--green);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .login-button:hover:not(:disabled) {
      background: #19b451;
    }

    .login-button:disabled {
      cursor: wait;
      opacity: .65;
    }

    #loginResult {
      min-height: 20px;
      margin-top: 14px;
      color: #dbe5ea;
      font-size: 13px;
      text-align: center;
    }

    #loginResult.login-error {
      color: #ffb4ad;
    }

    .login-footnote {
      margin-top: 20px;
      color: #9fb0bb;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 950px) {
      .campaign-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .detail-body {
        grid-template-columns: 210px 1fr;
      }

      .level-options {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 650px) {
      .topbar-inner {
        padding: 14px 16px;
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .brand-row {
        gap: 10px;
      }

      .divider {
        display: none;
      }

      .portal-title {
        white-space: normal;
      }

      .user-actions {
        width: 100%;
        justify-content: space-between;
      }

      .page {
        padding: 24px 14px 36px;
      }

      .campaign-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .detail-body {
        grid-template-columns: 1fr;
      }

      .current-panel {
        min-height: 180px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .change-panel {
        min-height: 0;
        padding: 24px 18px;
      }

      .level-options {
        grid-template-columns: repeat(4, 1fr);
      }

      .login-modal {
        padding: 27px 22px;
      }
    }
  </style>
</head>

<body>
  <div id="loginOverlay" class="login-overlay">
    <div class="login-modal">
      <h2>Control ACD</h2>
      <div class="subtitle">Inicia sesión para continuar</div>

      <label for="username">Usuario</label>
      <input id="username" type="text" autocomplete="username" placeholder="Usuario">

      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">

      <button id="loginButton" class="login-button" type="button">Iniciar sesión</button>
      <div id="loginResult" role="status" aria-live="polite"></div>
      <div class="login-footnote">Acceso autorizado únicamente</div>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand">AIMTI</div>
        <div class="divider"></div>
        <div class="portal-title">Control de Nivel de Marcación ACD</div>
      </div>

      <div class="user-actions">
        <span id="sessionUser" class="user-name"></span>
        <button id="logoutButton" class="logout-button" type="button" hidden>Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main id="mainPortal" class="page" hidden>
    <section>
      <div class="section-heading">
        <h1>Mis campañas</h1>
        <p>Selecciona una campaña para consultar o modificar su nivel de marcación.</p>
      </div>

      <div id="campaignGrid" class="campaign-grid"></div>
    </section>

    <section class="detail-card">
      <div class="detail-header">
        <div class="detail-kicker">Campaña seleccionada</div>
        <div id="selectedCampaignTitle" class="detail-title">-</div>
      </div>

      <div class="detail-body">
        <div class="current-panel">
          <div class="current-label">Nivel actual de marcación</div>
          <div id="currentLevel" class="current-value">-</div>
          <div id="currentStatus" class="current-status">Selecciona una campaña</div>
        </div>

        <div class="change-panel">
          <div class="change-title">Nuevo nivel de marcación</div>
          <div id="levelOptions" class="level-options"></div>
          <button id="applyButton" class="apply-button" type="button" disabled>Aplicar cambio</button>
        </div>
      </div>

      <div id="result" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const API_BASE = "https://vicidial97.directo.com/acd-api";
    const MIN_ACD_LEVEL = 1;
    const MAX_ACD_LEVEL = 8;

    const CAMPAIGNS = [
      { id: 91580, name: "AIMTI DEBITO", shortName: "AIMTI DEBITO" },
      { id: 91581, name: "AIMTI CREDITO", shortName: "AIMTI CREDITO" },
      { id: 91582, name: "AIMTI WELLCOME CREDITO", shortName: "AIMTI WELLCOME" },
      { id: 91583, name: "AIMTI CAPACITACION", shortName: "AIMTI CAPACITACION" },
      { id: 91584, name: "AIMTI RECUPERACION", shortName: "AIMTI RECUPERACION" }
    ];

    let accessToken = "";
    let authorizedCampaigns = [];
    let selectedCampaignId = 91580;
    let currentACD = null;
    let selectedLevel = null;
    let preloadGeneration = 0;

    const loginOverlay = document.getElementById("loginOverlay");
    const mainPortal = document.getElementById("mainPortal");
    const usernameElement = document.getElementById("username");
    const passwordElement = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const loginResultElement = document.getElementById("loginResult");
    const logoutButton = document.getElementById("logoutButton");
    const sessionUserElement = document.getElementById("sessionUser");
    const campaignGridElement = document.getElementById("campaignGrid");
    const selectedCampaignTitleElement = document.getElementById("selectedCampaignTitle");
    const currentLevelElement = document.getElementById("currentLevel");
    const currentStatusElement = document.getElementById("currentStatus");
    const levelOptionsElement = document.getElementById("levelOptions");
    const applyButton = document.getElementById("applyButton");
    const resultElement = document.getElementById("result");

    function getCampaign(campaignId) {
      return CAMPAIGNS.find(function (campaign) {
        return campaign.id === Number(campaignId);
      });
    }

    function showMessage(type, message) {
      resultElement.className = type;
      resultElement.textContent = message;
    }

    function clearMessage() {
      resultElement.className = "";
      resultElement.style.display = "none";
      resultElement.textContent = "";
    }

    function showLoginMessage(message) {
      loginResultElement.className = "login-error";
      loginResultElement.textContent = message;
    }

    function clearLoginMessage() {
      loginResultElement.className = "";
      loginResultElement.textContent = "";
    }

    async function readJsonResponse(response) {
      const contentType = response.headers.get("content-type") || "";

      if (!contentType.includes("application/json")) {
        const body = await response.text();
        throw new Error(
          "La API respondió contenido no JSON (HTTP " + response.status + ")."
          + (body.startsWith("<!DOCTYPE") ? " Se recibió una página HTML." : "")
        );
      }

      return response.json();
    }

    function renderLevelOptions() {
      levelOptionsElement.innerHTML = "";

      for (let level = MIN_ACD_LEVEL; level <= MAX_ACD_LEVEL; level += 1) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "level-button";
        button.textContent = String(level);
        button.dataset.level = String(level);
        button.disabled = !accessToken || !Number.isInteger(currentACD);

        if (selectedLevel === level) {
          button.classList.add("active");
        }

        button.addEventListener("click", function () {
          if (!accessToken || !Number.isInteger(currentACD)) {
            return;
          }

          selectedLevel = level;
          renderLevelOptions();
        });

        levelOptionsElement.appendChild(button);
      }
    }

    function renderCampaignCards() {
      campaignGridElement.innerHTML = "";

      CAMPAIGNS.forEach(function (campaign) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "campaign-card";
        card.dataset.campaignId = String(campaign.id);

        if (campaign.id === selectedCampaignId) {
          card.classList.add("selected");
        }

        const allowed = authorizedCampaigns.includes(campaign.id);
        card.disabled = accessToken ? !allowed : true;

        card.innerHTML =
          '<div class="campaign-id">' + campaign.id + '</div>'
          + '<div class="campaign-name">' + campaign.shortName + '</div>'
          + '<div class="campaign-level-label">Nivel actual</div>'
          + '<div class="campaign-level" id="campaignLevel-' + campaign.id + '">'
          + (allowed ? '-' : '—')
          + '</div>';

        card.addEventListener("click", function () {
          selectCampaign(campaign.id);
        });

        campaignGridElement.appendChild(card);
      });
    }

    function updateCampaignCardLevel(campaignId, value, loading) {
      const element = document.getElementById("campaignLevel-" + campaignId);

      if (!element) {
        return;
      }

      element.classList.toggle("loading", Boolean(loading));
      element.textContent = loading ? "Consultando..." : String(value);
    }

    function updateSelectedCard() {
      document.querySelectorAll(".campaign-card").forEach(function (card) {
        const id = Number.parseInt(card.dataset.campaignId, 10);
        card.classList.toggle("selected", id === selectedCampaignId);
      });
    }

    function resetDetail() {
      currentACD = null;
      selectedLevel = null;
      currentLevelElement.textContent = "-";
      currentStatusElement.textContent = "Selecciona una campaña";
      applyButton.disabled = true;
      renderLevelOptions();
    }

    function resetAuthInterface() {
      preloadGeneration += 1;
      accessToken = "";
      authorizedCampaigns = [];
      selectedCampaignId = 91580;
      sessionUserElement.textContent = "";
      logoutButton.hidden = true;
      mainPortal.hidden = true;
      loginOverlay.hidden = false;
      usernameElement.disabled = false;
      passwordElement.disabled = false;
      passwordElement.value = "";
      loginButton.disabled = false;
      loginButton.textContent = "Iniciar sesión";
      resetDetail();
      renderCampaignCards();
    }

    async function fetchCampaignLevel(campaignId, updateDetail) {
      if (!accessToken) {
        throw new Error("La sesión no está activa.");
      }

      if (!authorizedCampaigns.includes(campaignId)) {
        throw new Error("Usuario no autorizado para esta campaña.");
      }

      updateCampaignCardLevel(campaignId, "-", true);

      if (updateDetail) {
        currentACD = null;
        selectedLevel = null;
        currentLevelElement.textContent = "-";
        currentStatusElement.textContent = "Consultando...";
        applyButton.disabled = true;
        renderLevelOptions();
      }

      const response = await fetch(
        API_BASE + "/api/acd/" + campaignId,
        {
          cache: "no-store",
          headers: {
            "Authorization": "Bearer " + accessToken
          }
        }
      );

      const data = await readJsonResponse(response);

      if (response.status === 401) {
        resetAuthInterface();
        throw new Error("La sesión expiró. Inicia sesión nuevamente.");
      }

      if (!response.ok) {
        updateCampaignCardLevel(campaignId, "?", false);
        throw new Error(data.detail || "Error consultando servicio");
      }

      const level = Number.parseInt(data.current_acd_level, 10);
      updateCampaignCardLevel(campaignId, level, false);

      if (updateDetail && selectedCampaignId === campaignId) {
        currentACD = level;
        selectedLevel = level;
        currentLevelElement.textContent = String(level);
        currentStatusElement.textContent = data.source === "cache"
          ? "Consulta actualizada"
          : "Consulta verificada en Presence";
        applyButton.disabled = false;
        renderLevelOptions();
      }

      return level;
    }

    async function selectCampaign(campaignId) {
      if (!accessToken || !authorizedCampaigns.includes(campaignId)) {
        return;
      }

      selectedCampaignId = campaignId;
      const campaign = getCampaign(campaignId);

      selectedCampaignTitleElement.textContent =
        campaign.id + " - " + campaign.name;

      updateSelectedCard();
      clearMessage();

      try {
        await fetchCampaignLevel(campaignId, true);
      } catch (error) {
        currentLevelElement.textContent = "?";
        currentStatusElement.textContent = "No disponible";
        showMessage("error", "Error consultando nivel actual: " + error.message);
      }
    }

    async function preloadOtherCampaigns(generation) {
      for (const campaign of CAMPAIGNS) {
        if (
          generation !== preloadGeneration
          || !accessToken
        ) {
          return;
        }

        if (
          campaign.id === selectedCampaignId
          || !authorizedCampaigns.includes(campaign.id)
        ) {
          continue;
        }

        try {
          await fetchCampaignLevel(campaign.id, false);
        } catch (error) {
          updateCampaignCardLevel(campaign.id, "?", false);
        }
      }
    }

    async function login() {
      const username = usernameElement.value.trim();
      const password = passwordElement.value;

      if (!username || !password) {
        showLoginMessage("Introduce usuario y contraseña.");
        usernameElement.focus();
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Validando...";
      clearLoginMessage();

      try {
        const response = await fetch(API_BASE + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await readJsonResponse(response);

        if (!response.ok) {
          throw new Error(data.detail || "No fue posible iniciar sesión");
        }

        accessToken = data.access_token;
        authorizedCampaigns = Array.isArray(data.campaigns)
          ? data.campaigns.map(Number)
          : [];

        const firstAllowed = CAMPAIGNS.find(function (campaign) {
          return authorizedCampaigns.includes(campaign.id);
        });

        if (!firstAllowed) {
          throw new Error("El usuario no tiene acceso a las campañas AIMTI.");
        }

        selectedCampaignId = firstAllowed.id;
        sessionUserElement.textContent = data.username || username;
        passwordElement.value = "";

        renderCampaignCards();
        selectedCampaignTitleElement.textContent =
          firstAllowed.id + " - " + firstAllowed.name;

        loginOverlay.hidden = true;
        mainPortal.hidden = false;
        logoutButton.hidden = false;

        clearMessage();

        const generation = ++preloadGeneration;
        await fetchCampaignLevel(firstAllowed.id, true);
        preloadOtherCampaigns(generation);

      } catch (error) {
        accessToken = "";
        authorizedCampaigns = [];
        showLoginMessage("Error de acceso: " + error.message);
        passwordElement.value = "";
        passwordElement.focus();
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Iniciar sesión";
      }
    }

    async function logout() {
      const tokenToRevoke = accessToken;

      resetAuthInterface();
      clearMessage();
      clearLoginMessage();

      if (tokenToRevoke) {
        try {
          await fetch(API_BASE + "/api/auth/logout", {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + tokenToRevoke
            }
          });
        } catch (error) {
          // La sesión local ya fue eliminada.
        }
      }

      loginResultElement.textContent = "Sesión cerrada.";
      usernameElement.focus();
    }

    async function applyACD() {
      const campaign = getCampaign(selectedCampaignId);
      const newLevel = Number(selectedLevel);

      if (!accessToken) {
        showMessage("error", "La sesión no está activa.");
        return;
      }

      if (!Number.isInteger(currentACD)) {
        showMessage("error", "No se pudo determinar el nivel actual.");
        return;
      }

      if (
        !Number.isInteger(newLevel)
        || newLevel < MIN_ACD_LEVEL
        || newLevel > MAX_ACD_LEVEL
      ) {
        showMessage("error", "Nivel no permitido. Solo se acepta de 1 a 8.");
        return;
      }

      const confirmed = window.confirm(
        "¿Confirmas el cambio?\n\n"
        + campaign.id + " - " + campaign.name + "\n\n"
        + "Nivel actual: " + currentACD + "\n"
        + "Nuevo nivel: " + newLevel
      );

      if (!confirmed) {
        return;
      }

      applyButton.disabled = true;
      levelOptionsElement.querySelectorAll("button").forEach(function (button) {
        button.disabled = true;
      });
      showMessage("info", "Aplicando cambio...");

      try {
        const response = await fetch(API_BASE + "/api/acd", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + accessToken
          },
          body: JSON.stringify({
            campaign_id: campaign.id,
            acd_level: newLevel
          })
        });

        const data = await readJsonResponse(response);

        if (response.status === 401) {
          resetAuthInterface();
        }

        if (!response.ok) {
          throw new Error(data.detail || "Error aplicando cambio");
        }

        currentACD = Number.parseInt(data.acd_level, 10);
        selectedLevel = currentACD;
        currentLevelElement.textContent = String(currentACD);
        currentStatusElement.textContent = "Cambio verificado en Presence";
        updateCampaignCardLevel(campaign.id, currentACD, false);
        renderLevelOptions();

        showMessage(
          "success",
          data.message || "Cambio aplicado y verificado correctamente."
        );

      } catch (error) {
        showMessage("error", "Error: " + error.message);
      } finally {
        if (accessToken) {
          applyButton.disabled = false;
          renderLevelOptions();
        }
      }
    }

    applyButton.addEventListener("click", applyACD);
    loginButton.addEventListener("click", login);
    logoutButton.addEventListener("click", logout);

    passwordElement.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        login();
      }
    });

    window.addEventListener("DOMContentLoaded", function () {
      renderCampaignCards();
      renderLevelOptions();
      resetAuthInterface();
      clearMessage();
      clearLoginMessage();
      usernameElement.focus();
    });
  </script>
</body>
</html>
