<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control ACD - AIMTI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #222;
    }
    .header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 22px 30px;
    }
    .header-row {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .header h1 { margin: 0; font-size: 26px; }
    .header p { margin: 7px 0 0; color: #666; }
    .badge {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-radius: 999px;
      background: #fff3cd;
      border: 1px solid #e4c45c;
      color: #6d5100;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: .04em;
    }
    .container {
      max-width: 760px;
      margin: 45px auto;
      padding: 0 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, .10);
    }
    .service-box {
      padding: 16px 18px;
      background: #eef4ff;
      border: 1px solid #b9ccec;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    .service-label {
      color: #5b6472;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logout-button {
      width: auto;
      padding: 8px 12px;
      border-radius: 999px;
      background: #6c757d;
      font-size: 12px;
      letter-spacing: .02em;
    }
    .logout-button:hover:not(:disabled) { background: #5c636a; }
    .login-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(20, 24, 32, .72);
      backdrop-filter: blur(5px);
    }
    .login-modal {
      width: 100%;
      max-width: 390px;
      padding: 32px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
    }
    .login-modal h2 {
      margin: 6px 0 8px;
      font-size: 26px;
    }
    .login-modal p {
      margin: 0 0 24px;
      color: #666;
      line-height: 1.45;
    }
    .login-modal input {
      width: 100%;
      margin-bottom: 14px;
      padding: 13px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 16px;
    }
    .login-modal button {
      margin-top: 8px;
    }
    #loginResult {
      min-height: 20px;
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.4;
    }
    .login-error {
      color: #b42318;
    }
    [hidden] { display: none !important; }
    .current-box {
      margin: 25px 0;
      padding: 22px;
      background: #f7f7f7;
      border-radius: 8px;
      text-align: center;
    }
    .current-label { font-size: 15px; color: #666; }
    .current-value {
      margin-top: 8px;
      font-size: 42px;
      font-weight: bold;
    }
    .loading { font-size: 18px; color: #777; }
    .field { margin-bottom: 24px; }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 9px;
    }
    select {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #146cda;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #0f5cbd; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    #result {
      display: none;
      margin-top: 22px;
      padding: 16px;
      border-radius: 7px;
      line-height: 1.5;
    }
    .success {
      display: block !important;
      background: #e7f6ea;
      border: 1px solid #aad7b3;
    }
    .error {
      display: block !important;
      background: #fdeaea;
      border: 1px solid #e3abab;
    }
    .info {
      display: block !important;
      background: #eef4ff;
      border: 1px solid #b9ccec;
    }
    @media (max-width: 600px) {
      .header { padding: 18px 20px; }
      .header-row { align-items: flex-start; flex-direction: column; }
      .header h1 { font-size: 22px; }
      .container { margin: 24px auto; padding: 0 12px; }
      .card { padding: 22px; }
      .header-actions { width: 100%; justify-content: space-between; }
      .login-modal { padding: 24px; }
    }
  </style>
</head>
<body>
  <div id="loginOverlay" class="login-overlay">
    <div class="login-modal">
      <div class="service-label">ACCESO PROTEGIDO</div>
      <h2>Control ACD</h2>
      <p>Ingresa tus credenciales para consultar y modificar las campañas autorizadas.</p>

      <label for="username">Usuario</label>
      <input id="username" type="text" autocomplete="username" placeholder="Usuario">

      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">

      <button id="loginButton" type="button">Iniciar sesión</button>
      <div id="loginResult" role="status" aria-live="polite"></div>
    </div>
  </div>

  <header class="header">
    <div class="header-row">
      <div>
        <h1>Control de Nivel de Marcación ACD</h1>
        <p>Campañas AIMTI</p>
      </div>
      <div class="header-actions">
        <span class="badge">ACCESO PROTEGIDO</span>
        <button id="logoutButton" class="logout-button" type="button" hidden>Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="container" id="mainPortal" hidden>
    <section class="card">
      <div class="service-box">
        <div class="service-label">Campaña autorizada</div>
        <div class="field" style="margin: 10px 0 0;">
          <label for="campaign">Campaña</label>
          <select id="campaign">
            <option value="91580">91580 — AIMTI DEBITO</option>
            <option value="91581">91581 — AIMTI CREDITO</option>
            <option value="91582">91582 — AIMTI WELLCOME CREDITO</option>
            <option value="91583">91583 — AIMTI CAPACITACION</option>
            <option value="91584">91584 — AIMTI RECUPERACION</option>
          </select>
        </div>
      </div>

      <div class="current-box">
        <div class="current-label">Nivel ACD actual</div>
        <div id="currentLevel" class="current-value">-</div>
        <div id="currentStatus" class="loading">Acceso requerido</div>
      </div>

      <div class="field">
        <label for="acdLevel">Nuevo nivel de marcación</label>
        <select id="acdLevel">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
        </select>
      </div>

      <button id="applyButton" type="button" disabled>Aplicar cambio</button>
      <div id="result" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const API_BASE = "https://vicidial97.directo.com/acd-api";
    const MIN_ACD_LEVEL = 1;
    const MAX_ACD_LEVEL = 8;

    let currentACD = null;
    let accessToken = "";
    let authorizedCampaigns = [];

    const currentLevelElement = document.getElementById("currentLevel");
    const currentStatusElement = document.getElementById("currentStatus");
    const campaignElement = document.getElementById("campaign");
    const acdLevelElement = document.getElementById("acdLevel");
    const applyButton = document.getElementById("applyButton");
    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");
    const usernameElement = document.getElementById("username");
    const passwordElement = document.getElementById("password");
    const resultElement = document.getElementById("result");
    const loginOverlay = document.getElementById("loginOverlay");
    const mainPortal = document.getElementById("mainPortal");
    const loginResultElement = document.getElementById("loginResult");

    function showMessage(type, message) {
      resultElement.className = type;
      resultElement.textContent = message;
    }

    function clearMessage() {
      resultElement.className = "";
      resultElement.style.display = "none";
      resultElement.textContent = "";
    }

    function showLoginMessage(message) {
      loginResultElement.className = "login-error";
      loginResultElement.textContent = message;
    }

    function clearLoginMessage() {
      loginResultElement.className = "";
      loginResultElement.textContent = "";
    }

    function getSelectedCampaign() {
      return {
        id: Number.parseInt(campaignElement.value, 10),
        name: campaignElement.options[campaignElement.selectedIndex].text
      };
    }

    async function readJsonResponse(response) {
      const contentType = response.headers.get("content-type") || "";

      if (!contentType.includes("application/json")) {
        const body = await response.text();
        throw new Error(
          "La API respondió contenido no JSON (HTTP " + response.status + ")."
          + (body.startsWith("<!DOCTYPE") ? " Se recibió una página HTML." : "")
        );
      }

      return response.json();
    }

    function resetAuthInterface() {
      accessToken = "";
      authorizedCampaigns = [];
      currentACD = null;
      applyButton.disabled = true;
      usernameElement.disabled = false;
      passwordElement.disabled = false;
      passwordElement.value = "";
      loginButton.disabled = false;
      loginButton.textContent = "Iniciar sesión";
      logoutButton.hidden = true;
      mainPortal.hidden = true;
      loginOverlay.hidden = false;
      currentLevelElement.textContent = "-";
      currentStatusElement.textContent = "Acceso requerido";
    }

    async function loadCurrentACD() {
      clearMessage();
      currentACD = null;
      applyButton.disabled = true;
      currentLevelElement.textContent = "-";
      currentStatusElement.textContent = "Consultando...";

      if (!accessToken) {
        currentStatusElement.textContent = "Acceso requerido";
        showMessage("info", "Inicia sesión para consultar las campañas AIMTI.");
        return false;
      }

      try {
        const campaign = getSelectedCampaign();

        if (authorizedCampaigns.length && !authorizedCampaigns.includes(campaign.id)) {
          throw new Error("El usuario no tiene acceso a esta campaña.");
        }

        const response = await fetch(
          API_BASE + "/api/acd/" + campaign.id,
          {
            cache: "no-store",
            headers: {
              "Authorization": "Bearer " + accessToken
            }
          }
        );
        const data = await readJsonResponse(response);

        if (response.status === 401) {
          resetAuthInterface();
        }

        if (!response.ok) {
          throw new Error(data.detail || "Error consultando servicio");
        }

        currentACD = Number.parseInt(data.current_acd_level, 10);
        currentLevelElement.textContent = currentACD;
        currentStatusElement.textContent = data.campaign_name || campaign.name;

        if (
          Number.isInteger(currentACD)
          && currentACD >= MIN_ACD_LEVEL
          && currentACD <= MAX_ACD_LEVEL
        ) {
          acdLevelElement.value = String(currentACD);
        }

        applyButton.disabled = false;
        return true;
      } catch (error) {
        currentLevelElement.textContent = "?";
        currentStatusElement.textContent = "No disponible";
        showMessage("error", "Error consultando nivel actual: " + error.message);
        return false;
      }
    }

    async function login() {
      const username = usernameElement.value.trim();
      const password = passwordElement.value;

      if (!username || !password) {
        showLoginMessage("Introduce usuario y contraseña.");
        usernameElement.focus();
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Validando...";
      clearLoginMessage();

      try {
        const response = await fetch(API_BASE + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await readJsonResponse(response);

        if (!response.ok) {
          throw new Error(data.detail || "No fue posible iniciar sesión");
        }

        accessToken = data.access_token;
        authorizedCampaigns = Array.isArray(data.campaigns)
          ? data.campaigns.map(Number)
          : [];

        const selectedCampaign = getSelectedCampaign();
        if (!authorizedCampaigns.includes(selectedCampaign.id)) {
          throw new Error("El usuario no tiene acceso a las campañas AIMTI.");
        }

        passwordElement.value = "";
        loginOverlay.hidden = true;
        mainPortal.hidden = false;
        logoutButton.hidden = false;

        await loadCurrentACD();
      } catch (error) {
        accessToken = "";
        authorizedCampaigns = [];
        showLoginMessage("Error de acceso: " + error.message);
        passwordElement.value = "";
        passwordElement.focus();
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Iniciar sesión";
      }
    }

    async function logout() {
      const tokenToRevoke = accessToken;

      resetAuthInterface();
      clearMessage();
      clearLoginMessage();

      if (tokenToRevoke) {
        try {
          await fetch(API_BASE + "/api/auth/logout", {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + tokenToRevoke
            }
          });
        } catch (error) {
          // La sesión local ya fue eliminada.
        }
      }

      loginResultElement.className = "";
      loginResultElement.textContent = "Sesión cerrada.";
      usernameElement.focus();
    }

    async function applyACD() {
      const campaign = getSelectedCampaign();
      const newLevel = Number.parseInt(acdLevelElement.value, 10);

      if (
        !Number.isInteger(newLevel)
        || newLevel < MIN_ACD_LEVEL
        || newLevel > MAX_ACD_LEVEL
      ) {
        showMessage("error", "Nivel no permitido. Solo se acepta de 1 a 8.");
        return;
      }

      if (!Number.isInteger(currentACD)) {
        showMessage("error", "No se pudo determinar el nivel actual.");
        return;
      }

      if (!accessToken) {
        showMessage("error", "La sesión no está activa.");
        return;
      }

      const confirmed = window.confirm(
        "¿Confirmas el cambio?\n\n"
        + campaign.name + "\n\n"
        + "Nivel actual: " + currentACD + "\n"
        + "Nuevo nivel: " + newLevel
      );

      if (!confirmed) {
        return;
      }

      applyButton.disabled = true;
      showMessage("info", "Aplicando cambio...");

      try {
        const response = await fetch(API_BASE + "/api/acd", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + accessToken
          },
          body: JSON.stringify({
            campaign_id: campaign.id,
            acd_level: newLevel
          })
        });
        const data = await readJsonResponse(response);

        if (response.status === 401) {
          resetAuthInterface();
        }

        if (!response.ok) {
          throw new Error(data.detail || "Error aplicando cambio");
        }

        currentACD = Number.parseInt(data.acd_level, 10);
        currentLevelElement.textContent = currentACD;
        acdLevelElement.value = String(currentACD);
        showMessage("success", data.message || "Cambio aplicado y verificado.");
      } catch (error) {
        showMessage("error", "Error: " + error.message);
      } finally {
        if (accessToken) {
          applyButton.disabled = false;
        }
      }
    }

    applyButton.addEventListener("click", applyACD);
    loginButton.addEventListener("click", login);
    logoutButton.addEventListener("click", logout);
    campaignElement.addEventListener("change", function () {
      if (accessToken) {
        loadCurrentACD();
      } else {
        currentACD = null;
        currentLevelElement.textContent = "-";
        currentStatusElement.textContent = "Acceso requerido";
        applyButton.disabled = true;
      }
    });
    passwordElement.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        login();
      }
    });
    window.addEventListener("DOMContentLoaded", function () {
      resetAuthInterface();
      clearMessage();
      clearLoginMessage();
      usernameElement.focus();
    });
  </script>
</body>
</html>
